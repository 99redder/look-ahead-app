name = "look-ahead-planner"
main = "src/index.js"
compatibility_date = "2026-07-25"

[vars]
ALLOWED_ORIGINS = "https://lookahead.easternshore.ai,https://stockstickies.com,https://www.stockstickies.com,http://localhost:5173,http://127.0.0.1:5173"
FIREBASE_PROJECT_ID = "red-s-stickies"

[[d1_databases]]
binding = "DB"
database_name = "look-ahead-planner-db"
database_id = "" # Set locally or in CI; do not hardcode production IDs.

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
